
<!DOCTYPE html><html lang="ta"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin - கிருபையின் களஞ்சியம்</title><style>body{font-family:Arial;background:#FFF8E1;padding:15px}.card{background:#fff;padding:20px;border-radius:15px;max-width:500px;margin:auto;box-shadow:0 4px 10px rgba(0,0,0,.1)}h2{color:#0D47A1;text-align:center}input,select,textarea{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:1px solid #ccc;box-sizing:border-box}button{background:#1E88E5;color:#fff;padding:12px;border:none;border-radius:10px;width:100%;font-size:16px;font-weight:bold}.hidden{display:none}</style></head><body><div id="loginBox" class="card"><h2>🔑 Admin Login</h2><input type="password" id="pwd" placeholder="Password = kirubai123"><button onclick="login()">Login</button><p id="err" style="color:red"></p></div><div id="adminBox" class="card hidden"><h2>பாடல் சேர்க்க</h2><select id="cat"><option value="1">1. ஆவிக்குரிய புத்தகம்</option><option value="2">2. ஆராதனை கீதங்கள்</option><option value="3">3. சுவிசேஷம்</option><option value="4">4. சிறுவர் பாடல்</option><option value="5">5. சிறுவர் கதை</option><option value="6">6. எண்கள் விளக்கம்</option></select><input id="title" placeholder="தலைப்பு"><textarea id="content" rows="8" placeholder="பாடல் வரிகள்"></textarea><input id="yt" placeholder="YouTube Link"><button onclick="save()">💾 சேமிக்க</button><button onclick="location.href='/'" style="background:#43A047;margin-top:10px">🌐 APP பார்க்க</button><p id="msg" style="color:green;text-align:center"></p><div id="list" style="margin-top:15px"></div></div><script>function login(){if(pwd.value==='kirubai123'){loginBox.classList.add('hidden');adminBox.classList.remove('hidden');showList()}else{err.innerText='Password தவறு'}}function save(){let c=cat.value,t=title.value,co=content.value,y=yt.value;if(!t||!co)return alert('தலைப்பு வேண்டும்');let k='kirubai_cat_'+c,d=JSON.parse(localStorage.getItem(k)||'[]');d.push({title:t,content:co,yt:y,date:new Date().toLocaleString()});localStorage.setItem(k,JSON.stringify(d));msg.innerText='✅ சேமித்தேன்';title.value=content.value=yt.value='';showList()}function showList(){let h='';for(let i=1;i<=6;i++){let d=JSON.parse(localStorage.getItem('kirubai_cat_'+i)||'[]');if(d.length){h+='<b>பிரிவு '+i+': '+d.length+'</b><br>';d.forEach((x,j)=>{h+='<div style=border:1px solid #ddd;padding:5px;margin:5px 0>'+x.title+' <a href=# onclick=del('+i+','+j+');return!1 style=color:red;float:right>Delete</a></div>'})}


}
