<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>கிருபையின் களஞ்சியம் - Admin</title>
<style>
body{font-family:Arial;background:#E8F5E9;margin:0;padding:10px}
.card{background:#fff;padding:15px;border-radius:15px;max-width:650px;margin:auto;box-shadow:0 2px 10px #bbb}
input,textarea{width:100%;padding:12px;margin:6px 0;border-radius:8px;border:1px solid #aaa;box-sizing:border-box;font-size:16px}
button{padding:10px;border:none;border-radius:8px;font-weight:bold;cursor:pointer}
.save{background:#2E7D32;color:#fff;width:100%;font-size:18px;padding:14px;margin-top:8px}
.edit{background:#FF9800;color:#fff}
.del{background:#f44336;color:#fff}
.song{background:#F1F8E9;border-left:5px solid #2E7D32;margin:10px 0;padding:12px;border-radius:8px}
pre{white-space:pre-wrap;font-family:Arial;margin:8px 0;font-size:15px}
</style>
</head>
<body>
<div class="card">
<h2 style="text-align:center;color:#2E7D32">🎵 கிருபையின் களஞ்சியம் - பாடல் Admin</h2>
<input type="hidden" id="editIndex" value="-1">
<label>பாடல் எண்:</label>
<input id="sno" type="number" placeholder="எ.கா: 1">
<label>பாடல் தலைப்பு:</label>
<input id="title" placeholder="எ.கா: கிருபை பெரியது">
<label>பாடல் வரிகள்:</label>
<textarea id="lyrics" rows="10" placeholder="பல்லவி, சரணம் எழுதுங்கள்..."></textarea>
<label>ராகம் / குறிப்பு:</label>
<input id="note" placeholder="எ.கா: 4/4">
<button class="save" onclick="saveSong()">💾 சேமிக்க / UPDATE</button>
<button onclick="clearForm()" style="width:100%;background:#999;color:#fff;margin-top:6px;padding:12px">🔄 புதியது</button>
<p id="msg" style="text-align:center;color:green;font-weight:bold"></p>
<hr>
<h3>📜 பாடல்கள்</h3>
<div id="list"></div>
</div>
<script>
let STORAGE_KEY='kirubai_songs';
function saveSong(){
  let no=document.getElementById('sno').value;
  let t=document.getElementById('title').value;
  let l=document.getElementById('lyrics').value;
  let n=document.getElementById('note').value;
  if(!t||!l){alert('தலைப்பு, பாடல் எழுதுங்கள்');return;}
  let d=JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]');
  let obj={no:no,title:t,lyrics:l,note:n,date:new Date().toLocaleDateString('ta-IN')};
  let idx=parseInt(document.getElementById('editIndex').value);
  if(idx>=0){d=obj;document.getElementById('msg').innerText='UPDATE ஆனது!';}
  else{d.push(obj);document.getElementById('msg').innerText='புதிய பாடல் சேர்ந்தது!';}
  http://d.sort((a,b)=>(parseInt(a.no)||999)-(parseInt(b.no)||999));
  http://localStorage.setItem(STORAGE_KEY,JSON.stringify(d));
  clearForm();
  showList();
}
function editSong(i){
  let d=JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]');
  let it=d;
  http://document.getElementById('sno').value=it.no;
  http://document.getElementById('title').value=it.title;
  http://document.getElementById('lyrics').value=it.lyrics;
  http://document.getElementById('note').value=it.note||'';
  http://document.getElementById('editIndex').value=i;
  http://window.scrollTo(0,0);
}
function delSong(i){
  if(!confirm('இந்த பாடலை நீக்கவா?'))return;
  let d=JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]');
  http://d.splice(i,1);
  http://localStorage.setItem(STORAGE_KEY,JSON.stringify(d));
  showList();
}
function clearForm(){
  http://document.getElementById('sno').value='';
  http://document.getElementById('title').value='';
  http://document.getElementById('lyrics').value='';
  http://document.getElementById('note').value='';
  http://document.getElementById('editIndex').value=-1;
  http://document.getElementById('msg').innerText='';
}
function showList(){
  let d=JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]');
  let listDiv=document.getElementById('list');
  if(!d.length){listDiv.innerHTML='<p>பாடல் இல்லை</p>';return;}
  let h='';
  http://d.forEach((x,i)=>{
    h+='<div class="song"><b>'+(x.no||'')+'. '+x.title+'</b><br><small>'+(x.note||'')+' | '+(x.date||'')+'</small><pre>'+x.lyrics.substring(0,120)+'...</pre><div style="display:flex;gap:6px"><button class="edit" onclick="editSong('+i+')" style="flex:1">Edit</button><button class="del" onclick="delSong('+i+')" style="flex:1">Delete</button></div></div>';
  });
  http://listDiv.innerHTML=h;
}
showList();
</script>
</body>
</html>[idx][i]
