
<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>கிருபையின் களஞ்சியம்</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:sans-serif;background:#f2f6ff;display:flex;justify-content:center}
.app{width:100%;max-width:420px;background:#fff;min-height:100vh;box-shadow:0 0 30px rgba(0,0,0,0.1)}
.header{background:linear-gradient(135deg,#e8b84b,#b47f1a);padding:18px 16px;display:flex;align-items:center;gap:14px}
.logo{width:88px;height:88px;background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,0.2);overflow:hidden;border:3px solid #fff}
.logo img{width:100%;height:100%;object-fit:cover}
.header h1{color:#fff;font-size:28px;line-height:1.2;font-weight:800;text-shadow:0 1px 2px rgba(0,0,0,0.2)}
.sub{color:#0d47a1;text-align:center;padding:16px 10px;font-size:16px;font-weight:700}
.buttons{padding:0 20px 20px;display:flex;flex-direction:column;gap:16px}
.btn{background:linear-gradient(180deg,#2a9af0,#1565c0);color:#fff;border:none;border-radius:50px;padding:18px 20px;font-size:18px;font-weight:700;display:flex;align-items:center;gap:14px;box-shadow:0 4px 12px rgba(21,101,192,0.3);cursor:pointer;text-align:left}
.btn span{font-size:22px}
.footer{background:#fbe9bb;display:flex;justify-content:space-around;padding:14px 0;border-top:1px solid #f0d9a0}
.footer i{font-size:24px;color:#b47f1a}
</style>
</head>
<body>
<div class="app">
<div class="header">
<div class="logo"><img src="https://i.ibb.co/4gXzQ7Y/dove-logo.png" onerror="this.parentElement.innerHTML='🕊️'" alt="logo"></div>
<h1>கிருபையின்<br>களஞ்சியம்</h1>
</div>
<div class="sub">கிருபை ஒவ்வொரு ஆத்துமாவிற்கும்</div>
<div class="buttons">
<button class="btn"><span>📖</span> 1. ஆவிக்குரிய புத்தகம்</button>
<button class="btn"><span>🎵</span> 2. ஆராதனை கீதங்கள்</button>
<button class="btn"><span>🎵</span> 3. சுவிசேஷ பாடல்கள்</button>
<button class="btn"><span>👨‍👧‍</span> 4. சிறுவர் பாடல்கள்</button>
<button class="btn"><span>📖</span> 5. சிறுவர் கதைகள்</button>
<button class="btn"><span>📊</span> 6. எண்கள் விளக்கம்</button>
<button class="btn"><span>💬</span> 7. பிரசங்க குறிப்பு<br>/ ஆலோசனை மையம்</button>
</div>
<div class="footer">
<div>🏠</div><div>🔍</div><div>❤️</div><div>👤</div>
</div>
</div>
</body>
</html>
