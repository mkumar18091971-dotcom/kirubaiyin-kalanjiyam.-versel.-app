
<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>கிருபையின் களஞ்சியம்</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{min-height:100vh;display:flex;justify-content:center;background:linear-gradient(135deg,#fff8e1,#ffecb3);padding:0}
.app{width:100%;max-width:420px;background:white;min-height:100vh;display:flex;flex-direction:column}
.header{background:linear-gradient(135deg,#e8b84b,#b47f1a);padding:16px;display:flex;align-items:center;gap:12px;color:white}
.logo{width:60px;height:60px;background:white;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px}
.header h1{font-size:22px;font-weight:800;line-height:1.2}
.sub{background:#fff3d6;color:#8a6d1b;text-align:center;padding:10px;font-size:14px;font-weight:600}
.buttons{flex:1;display:flex;flex-direction:column;gap:14px;padding:18px;background:white}
.btn{width:100%;padding:16px;border:none;border-radius:14px;background:linear-gradient(135deg,#fbe9bb,#f5d78e);color:#5a4210;font-size:16px;font-weight:700;display:flex;gap:12px;text-align:left}
.footer{background:#fbe9bb;display:flex;justify-content:space-around;padding:14px 0;border-top:1px solid #f5d78e}
.footer i{font-size:22px;color:#b47f1a}
</style>
</head>
<body>
<div class="app">
<div class="header">
<div class="logo">✝️</div>
<h1>கிருபையின்<br>களஞ்சியம்</h1>
</div>
<div class="sub">கிருபை ஒவ்வொரு ஆத்துமாவையும் நிறைவாக்கும்</div>
<div class="buttons">
<button class="btn">📖 1. ஆவிக்குரிய சிந்தனைகள்</button>
<button class="btn">🎵 2. ஆராதனை பாடல்கள்</button>
<button class="btn">🎵 3. சிறுவர் பாடல்கள்</button>
<button class="btn">👨‍🏫 4. சிறுவர் கதைகள்</button>
<button class="btn">📖 5. சிறுவர் வசனங்கள்</button>
<button class="btn">🙏 6. ஜெப குறிப்புகள்</button>
</div>
<div class="footer">
<i class="fa-solid fa-house"></i>
<i class="fa-solid fa-book-bible"></i>
<i class="fa-solid fa-music"></i>
<i class="fa-solid fa-user"></i>
</div>
</div>
</body>
  </html>
